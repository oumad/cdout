[package]
name = "cdout"
version = "0.3.1"
description = "cdout — an AI assistant that turns file-manager selections into approved shell commands"
authors = ["Mohamed Oumoumad <oumoumad@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cdout_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cdout-core = { path = "crates/cdout-core" }
# `macos-private-api` backs `macOSPrivateApi` in tauri.conf.json, without which
# the transparent spotlight/main windows render opaque on macOS. It is inert on
# other targets but must be declared unconditionally, because tauri-build
# validates the feature list against the shared config on every platform.
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
members = ["crates/*"]
resolver = "2"
