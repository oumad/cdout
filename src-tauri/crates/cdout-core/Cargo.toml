[package]
name = "cdout-core"
version = "0.3.1"
description = "cdout's UI-agnostic backend: agent loop, LLM clients, tools, sessions, skills, config"
edition = "2021"
publish = false

[features]
# Deterministic scripted LLM for end-to-end tests of the shells. Inert unless
# CDOUT_FAKE_LLM is also set at runtime. Never enable in release builds.
fake-llm = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12.9", features = ["json", "stream"] }
tokio = { version = "1.49.0", features = ["full"] }
natord = "1.0.9"
dirs = "5.0"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
bytes = "1"
serde_yaml = "0.9"
include_dir = "0.7"

# Explorer introspection via COM. Windows-only: an unconditional dependency
# here is what stops the crate compiling on macOS at all.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.52.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Decoding the `file:///` URLs Explorer reports as a tab's location.
urlencoding = "2.1.3"

# `killpg`, so cancelling a command takes down ffmpeg and friends with it.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
