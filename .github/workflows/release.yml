name: Release

# Builds cdout for Windows and macOS whenever a version tag is pushed:
#   git tag v0.5.0 && git push origin v0.5.0
# and attaches both builds to one draft GitHub Release:
#   - cdout-<version>-windows-x64.zip    (cdout.exe; unzip anywhere and run)
#   - cdout-<version>-universal.dmg      (macOS, Intel + Apple silicon)
# A manual run from the Actions tab builds only and keeps the files as
# workflow artifacts.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# One release per tag, ever. Never cancel a run that may already be
# mid-upload; queue behind it instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The draft release is created once, up front, so the two platform builds
  # only ever upload to it and cannot race each other into two releases.
  draft:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create the draft release unless it exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          NOTES: |
            cdout ${{ github.ref_name }}.

            **Windows** — download the `.zip`, unzip anywhere, run `cdout.exe`.
            No installation. Settings and sessions live in `%APPDATA%\cdout`.

            **macOS** — download the `.dmg` and drag cdout to Applications.
            The build is unsigned, so the first launch needs a right-click →
            **Open** (or `xattr -dr com.apple.quarantine /Applications/cdout.app`).
            On first use cdout asks for permission to control Finder — that is
            how it reads your open folder and selected files; without it the
            file context stays empty. Settings and sessions live in
            `~/Library/Application Support/cdout`.
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" --draft --title "cdout $TAG" --notes "$NOTES"
          fi

  build:
    needs: draft
    # A manual run skips `draft`; still build.
    if: always() && (needs.draft.result == 'success' || needs.draft.result == 'skipped')
    strategy:
      # Never cancel the Windows build because the macOS one failed, or vice
      # versa; a half-populated draft is easier to finish by hand.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-release

      - name: Build and zip (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cargo build -p cdout --release
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed" }
          $version = (Select-String -Path "Cargo.toml" -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $stage = "dist/cdout"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/release/cdout.exe" -Destination $stage
          @"
          cdout $version

          Run cdout.exe. No installation required.
          The global hotkey (default Ctrl+Alt+A) opens the spotlight prompt.
          Settings, API keys and sessions live in %APPDATA%\cdout; logs in %APPDATA%\cdout\logs.
          "@ | Set-Content -Path "$stage/README.txt" -Encoding utf8
          $zip = "dist/cdout-$version-windows-x64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          "ASSET=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build app bundle and DMG (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          bash scripts/package-macos.sh
          echo "ASSET=$(ls dist/*.dmg)" >> "$GITHUB_ENV"

      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "$ASSET" --clobber

      - name: Keep the build as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdout-${{ matrix.os }}
          path: ${{ env.ASSET }}
