name: CI

# Runs the test suites on both supported platforms. The release workflow only
# proves the app *builds*; this proves it works, and it is the only thing that
# type-checks the Windows COM code and the macOS AppleScript code against each
# other, since half of the platform layer is `cfg`-ed out on any single machine.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-ci

      # Unit tests of both crates, plus the app's headless screen tests and
      # glyph coverage. Pixel snapshots are compared only locally: CI GPUs
      # (WARP, Metal) render slightly differently from the machine that
      # recorded them.
      - name: Tests
        run: cargo test --workspace
        env:
          CDOUT_SKIP_SNAPSHOTS: "1"

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The scripted model behind scripts/native-smoke.ps1 must keep compiling.
      - name: Clippy (fake-llm)
        run: cargo clippy -p cdout --features fake-llm --all-targets -- -D warnings

      - name: Formatting
        run: cargo fmt --all --check
