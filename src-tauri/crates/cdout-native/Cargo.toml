[package]
name = "cdout-native"
version = "0.3.1"
description = "cdout as a native Rust desktop app (egui), sharing cdout-core with the Tauri shell"
edition = "2021"
publish = false

[lib]
name = "cdout_native"
path = "src/lib.rs"

[[bin]]
name = "cdout-native"
path = "src/main.rs"

[features]
# Forwarded so `cargo run -p cdout-native --features fake-llm` works.
fake-llm = ["cdout-core/fake-llm"]

[dependencies]
cdout-core = { path = "../cdout-core" }
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
egui_extras = { version = "0.35", default-features = false }
egui_commonmark = { version = "0.24", default-features = false, features = ["better_syntax_highlighting"] }
tray-icon = "0.26"
global-hotkey = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
open = "5"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSArray", "NSNotification", "NSOperation", "NSString", "block2"] }
objc2-app-kit = { version = "0.3", features = ["NSScreen", "NSEvent", "NSWindow", "NSView", "NSResponder", "NSGraphics", "NSRunningApplication", "NSApplication"] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
egui_kittest = { version = "0.35", features = ["snapshot", "wgpu"] }
