[package]
name = "cdout-spike"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
tray-icon = "0.26"
global-hotkey = "0.8"

[dev-dependencies]
egui_kittest = { version = "0.35", features = ["snapshot", "wgpu"] }

[profile.dev]
opt-level = 1
